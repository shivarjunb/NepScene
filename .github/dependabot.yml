version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
    labels: ["type:chore", "area:devops"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
    labels: ["type:chore", "area:devops"]
    # One PR for all action bumps, not one each. Four separate PRs fired four
    # workflows apiece and buried a single self-hosted runner under sixteen
    # queued jobs (docs/DEVOPS.md > Contention).
    groups:
      github-actions:
        patterns: ["*"]
