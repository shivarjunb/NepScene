version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
    labels: ["type:chore", "area:devops"]
    ignore:
      # @cloudflare/vitest-pool-workers@0.22.0 (latest as of 2026-09) pins its
      # peer dep to vitest ^4.1.0. A grouped major bump to vitest 5 breaks
      # `npm ci` with an ERESOLVE before any test even runs (PR #70). Drop
      # this once pool-workers ships vitest 5 support.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-istanbul"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the native Go port) is a major toolchain change, not a
      # dev-dependency patch. It deserves its own reviewed PR, not a spot in
      # a grouped bump alongside eslint and @types packages.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
    labels: ["type:chore", "area:devops"]
    # One PR for all action bumps, not one each. Four separate PRs fired four
    # workflows apiece and buried a single self-hosted runner under sixteen
    # queued jobs (docs/DEVOPS.md > Contention).
    groups:
      github-actions:
        patterns: ["*"]
