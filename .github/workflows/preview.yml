name: Preview deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy:
    name: Deploy preview
    # Fork PRs never deploy. Dependabot PRs do not either: a dependency bump has
    # nothing to look at, and on one runner each preview deploy is ~4 minutes
    # other work waits behind.
    if: ${{ !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
    runs-on: self-hosted
    environment:
      name: preview
    steps:
      - uses: actions/checkout@v7
      - name: Guard on scaffold
        id: guard
        run: |
          if [ -f package.json ] && [ -f wrangler.jsonc ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Scaffold not present yet — preview deploy skipped."
          fi
      - uses: actions/setup-node@v7
        if: steps.guard.outputs.ready == 'true'
        with: { node-version: 22, cache: npm }
      - run: npm ci
        if: steps.guard.outputs.ready == 'true'
      - run: npm run build
        if: steps.guard.outputs.ready == 'true'
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          # Baked into og:image and og:url — see vite.config.ts. Update with #60.
          #
          # Staging, not preview, and not a guess. A preview's own URL is the
          # per-version one wrangler mints *after* this build runs, so it cannot
          # be baked in. The preview environment's stable URL is worse than
          # useless: `versions upload` never changes the deployed version, so
          # https://nepscene-preview…workers.dev serves an old build whose
          # /brand/og-card.png 404s into the SPA fallback and returns HTML with a
          # 200. Staging is the nearest origin that is always current.
          VITE_PUBLIC_ORIGIN: https://nepscene-staging.bhattarai-shiva.workers.dev

      # The ledger, not the schema, is what `migrations apply` trusts. When a
      # migration file has been applied any other way the two disagree, and the
      # replay dies partway through a file that has no transaction around it.
      # This says so in a sentence, before wrangler writes anything.
      - name: Check schema drift on preview
        if: steps.guard.outputs.ready == 'true'
        run: node scripts/check-schema-drift.mjs --env preview --database nepscene-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A preview deploys code against a *shared, persistent* database, so it
      # has to migrate the same way staging does. Without this the preview D1
      # sat at 0004 while the repo reached 0008, and every preview since then
      # answered /api/catalog/listings with a 500 — the branch under review
      # looked broken and the pipeline was what was broken.
      #
      # Safe to run on every PR: `migrations apply` is idempotent and applies
      # only what is missing. Two PRs whose migrations conflict will collide
      # here, and that is the right place to find out.
      - name: Apply migrations to preview
        if: steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --env preview, or wrangler resolves the database from the top-level
          # config — where it is nepscene-local — and aborts.
          command: d1 migrations apply nepscene-preview --env preview --remote

      # --env preview is not optional. Without it wrangler uploads the top-level
      # config, whose bindings are local placeholders — the deploy fails on
      # `KV namespace '0000000000000000000000000000local' is not valid` after
      # provisioning a junk R2 bucket in the real account.
      - name: Deploy to Workers preview
        id: deploy
        if: steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            versions upload --env preview
            --tag pr-${{ github.event.pull_request.number }}
            --message "PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}"

      # The URL is whatever wrangler minted for this version — it is not
      # derivable from the PR number, and guessing it produced a comment
      # pointing at a 404.
      - name: Resolve the preview URL
        id: url
        if: steps.guard.outputs.ready == 'true'
        env:
          WRANGLER_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          # wrangler prints "Version Preview URL: https://<version>-<worker>.<subdomain>.workers.dev".
          # Read the labelled line first; fall back to any workers.dev URL in the
          # output. The subdomain contains dots, so the pattern must allow them.
          URL=$(printf '%s\n' "$WRANGLER_OUTPUT" \
            | sed -n 's|^.*Version Preview URL: *\(https://[^ ]*\).*$|\1|p' | head -1)
          if [ -z "$URL" ]; then
            URL=$(printf '%s\n' "$WRANGLER_OUTPUT" \
              | grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' | head -1)
          fi
          if [ -z "$URL" ]; then
            echo "::error::Deploy succeeded but no preview URL appeared in wrangler's output."
            exit 1
          fi
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview: $URL"
      - name: Comment the preview URL
        if: steps.guard.outputs.ready == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const url = '${{ steps.url.outputs.preview_url }}'
            const marker = '<!-- nepscene-preview -->'
            const body = `${marker}\n**Preview deployed** → ${url}\n\nBuilt from \`${context.sha.slice(0,7)}\`.`
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            })
            const existing = comments.find(c => c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.payload.pull_request.number, body })
            }
