name: Preview deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy:
    name: Deploy preview
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: self-hosted
    environment:
      name: preview
    steps:
      - uses: actions/checkout@v4
      - name: Guard on scaffold
        id: guard
        run: |
          if [ -f package.json ] && [ -f wrangler.jsonc ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Scaffold not present yet — preview deploy skipped."
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with: { node-version: 22, cache: npm }
      - run: npm ci
        if: steps.guard.outputs.ready == 'true'
      - run: npm run build
        if: steps.guard.outputs.ready == 'true'
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      - name: Deploy to Workers preview
        if: steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --tag pr-${{ github.event.pull_request.number }}
      - name: Comment the preview URL
        if: steps.guard.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://pr-${context.payload.pull_request.number}-nepscene.workers.dev`
            const marker = '<!-- nepscene-preview -->'
            const body = `${marker}\n**Preview deployed** → ${url}\n\nBuilt from \`${context.sha.slice(0,7)}\`.`
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            })
            const existing = comments.find(c => c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.payload.pull_request.number, body })
            }
