name: Daily scrapes

on:
  schedule:
    # 00:15 UTC = 06:00 Asia/Kathmandu.
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-scrapes
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # ticketsanjal is temporarily disabled in scripts/scrape-all.mjs, so its
      # own dependencies and Playwright's Chromium install aren't needed here.
      # Restore both alongside re-enabling that job.
      - name: Test scrapers and daily runner
        run: npm run test:scrapers
      - name: Run all public scrapers
        run: npm run scrape:all
      - name: Save results and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-scrapes-${{ github.run_id }}-${{ github.run_attempt }}
          path: scrape-output/
          retention-days: 30
          if-no-files-found: warn
