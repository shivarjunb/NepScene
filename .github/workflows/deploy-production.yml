name: Deploy to production

# The commit goes in the title: a dispatched run's own head SHA is main at the
# moment it was started, not the commit it deployed, and the staging console
# (api/admin/deploys.ts) reads what production is running from here.
run-name: Deploy ${{ inputs.sha }} — ${{ inputs.reason }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to promote (must already be green on staging)
        required: true
      reason:
        description: Why are we deploying?
        required: true

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  actions: read               # the gate below reads deploy-staging.yml's run history

jobs:
  # Deliberately has no `environment:`. A job that declares one is held at the
  # approval gate before any of its steps run, so a guard living inside `promote`
  # could only refuse a bad SHA *after* a human had already approved promoting it.
  # Split out, an unverified SHA is rejected before it costs anyone a click.
  gate:
    name: Confirm this SHA succeeded on staging
    runs-on: self-hosted
    permissions:
      actions: read             # deploy-staging.yml's run history
      contents: read
      pull-requests: write      # the reviewers' @mention, on the commit's PR
      issues: write             # …or on an issue, for a commit with no PR
    steps:
      - name: Confirm this SHA succeeded on staging
        uses: actions/github-script@v9
        with:
          script: |
            const sha = context.payload.inputs.sha
            // An automatic promotion is dispatched by the staging run's own last
            // step, so that run can still be finishing when this starts. Wait for
            // it — up to ten minutes — rather than refuse it; what passes is
            // unchanged: a staging run of this SHA that concluded `success`.
            let conclusions = []
            for (let attempt = 0; ; attempt++) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner, repo: context.repo.repo,
                workflow_id: 'deploy-staging.yml', head_sha: sha
              })
              conclusions = runs.data.workflow_runs.map((r) => r.conclusion)
              const unfinished = runs.data.workflow_runs.some((r) => r.status !== 'completed')
              if (conclusions.includes('success') || !unfinished || attempt >= 40) break
              core.info(`A staging run for ${sha} is still running; checking again in 15s`)
              await new Promise((resolve) => setTimeout(resolve, 15000))
            }
            // Logged either way: a gate that can only be observed when it fails is
            // one you cannot tell apart from a gate that is broken open.
            core.info(`Staging runs for ${sha}: ${conclusions.length ? conclusions.map((c) => c ?? 'unfinished').join(', ') : 'none'}`)
            if (!conclusions.includes('success')) {
              core.setFailed(`No successful staging deploy for ${sha}. Promote a verified commit.`)
            }

      # `promote` is about to wait at the production environment's approval
      # gate. GitHub's own "review requested" notice is easy to miss, and when
      # the reviewer started the run themselves it may not come at all; an
      # @mention from the Actions bot does — email and a GitHub-app push, from
      # which the deploy can be approved. Reviewers: the PRODUCTION_REVIEWERS repo
      # variable (space- or comma-separated logins), else the repo's owner.
      # Best effort: a notice that fails to post must not block the deploy.
      - name: Tell the reviewers a deploy is waiting
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          REVIEWERS: ${{ vars.PRODUCTION_REVIEWERS }}
        with:
          script: |
            const { owner, repo } = context.repo
            const { sha, reason } = context.payload.inputs
            const mentions = (process.env.REVIEWERS || owner).split(/[\s,]+/).filter(Boolean).map((r) => '@' + r.replace(/^@/, '')).join(' ')
            const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            const body = `${mentions} a production deploy of \`${sha.slice(0, 7)}\` is waiting for your approval.\n\n**Reason:** ${reason}\n\n**[Review and approve →](${url})**`
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha })
            if (prs.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: prs[0].number, body })
              core.info(`Asked ${mentions} on #${prs[0].number}`)
            } else {
              const { data: issue } = await github.rest.issues.create({ owner, repo, title: `Production deploy of ${sha.slice(0, 7)} is waiting for approval`, body })
              core.info(`Asked ${mentions} on #${issue.number}`)
            }

  promote:
    name: Promote to production
    needs: gate
    runs-on: self-hosted
    environment:
      name: production          # Requires a reviewer approval, configured in repo settings
      url: https://nepscene.bhattarai-shiva.workers.dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          # Baked into og:image and og:url — see vite.config.ts. Update with #60.
          VITE_PUBLIC_ORIGIN: https://nepscene.bhattarai-shiva.workers.dev

      # The ledger, not the schema, is what `migrations apply` trusts. When a
      # migration file has been applied any other way the two disagree, and the
      # replay dies partway through a file that has no transaction around it.
      # This says so in a sentence, before wrangler writes anything.
      - name: Check schema drift on production
        run: node scripts/check-schema-drift.mjs --env production --database nepscene-production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply migrations to production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply nepscene-production --env production --remote

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production

      - name: Smoke test
        run: node scripts/smoke.mjs https://nepscene.bhattarai-shiva.workers.dev production

      # Through the environment, not `${{ }}` in the script: the reason is
      # free text typed into the staging console, and pasted into a shell line
      # a `$(…)` in it would run.
      - name: Record the release
        env:
          SHA: ${{ inputs.sha }}
          REASON: ${{ inputs.reason }}
        run: |
          echo "Promoted $SHA to production"
          echo "Reason: $REASON"
