name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # One job, not a matrix. The runner is self-hosted and singular (#53), so a
  # four-way matrix runs serially and pays for `npm ci` four times — thirteen
  # minutes against the five-minute bar in #10. Sequential steps sharing one
  # install come in around three.
  verify:
    name: verify
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # Guards first: they need no dependencies and fail in seconds.
      - name: Migration hygiene
        run: node scripts/check-migrations.mjs

      - name: Scope guard
        run: node scripts/check-scope.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee tsc.log || TSC_FAILED=1
          node scripts/annotate.mjs tsc < tsc.log
          exit ${TSC_FAILED:-0}

      - name: Lint
        run: |
          npx eslint . -f json -o eslint-report.json || LINT_FAILED=1
          node scripts/annotate.mjs eslint eslint-report.json
          exit ${LINT_FAILED:-0}

      - name: Test with coverage
        # Thresholds live in vitest.config.ts and are set at the measured floor,
        # so a coverage drop fails here rather than being noticed later.
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Comment coverage on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('child_process')
            const marker = '<!-- nepscene-coverage -->'
            const table = execFileSync('node', ['scripts/coverage-summary.mjs'], { encoding: 'utf8' })
            if (!table.trim()) return
            const body = `${marker}\n${table}`
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find(c => c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body })
            }
