name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # One job, not a matrix. The runner is self-hosted and singular (#53), so a
  # four-way matrix runs serially and pays for `npm ci` four times — thirteen
  # minutes against the five-minute bar in #10. Sequential steps sharing one
  # install come in around three.
  verify:
    name: verify
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v7

      # Ahead of the guards below, not after. They call `node` directly, and a
      # self-hosted runner host has no guarantee of a system-wide Node install
      # the way a GitHub-hosted image does — this step is what puts `node` on
      # PATH regardless of what the host has. On a self-hosted runner it's
      # cheap: it resolves to the toolcache or the system install already
      # matching node-version rather than downloading anything.
      #
      # No `cache: npm`. On a hosted runner it saves a cold `~/.npm`; on this
      # self-hosted one `~/.npm` is already warm and shared with the developer's
      # own work, so the option was uploading the whole 1 GB directory to
      # GitHub on every lockfile change and downloading it back onto the machine
      # it came from — ten of those filled the repository's cache store.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Guards next: they need no other dependencies and fail in seconds.
      - name: Migration hygiene
        run: node scripts/check-migrations.mjs

      - name: Scope guard
        run: node scripts/check-scope.mjs

      # Covers what GitHub push protection does not: an `AIza…` Google key
      # pushes to this repository cleanly, and that is the Maps key's shape.
      - name: Committed credential guard
        run: node scripts/check-secrets.mjs

      # An error caught and not reported is worse than one that crashes: it
      # removes the signal without removing the problem (#50). Fails rather
      # than warns — a silent catch is either a bug or a one-line allow with a
      # reason, and both belong to the author.
      - name: Silent catch guard
        run: node scripts/check-silent-catches.mjs

      - run: npm ci

      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee tsc.log || TSC_FAILED=1
          node scripts/annotate.mjs tsc < tsc.log
          exit ${TSC_FAILED:-0}

      - name: Lint
        run: |
          npx eslint . -f json -o eslint-report.json || LINT_FAILED=1
          node scripts/annotate.mjs eslint eslint-report.json
          exit ${LINT_FAILED:-0}

      - name: Scraper and importer tests
        run: npm run test:scrapers

      # Before the tests, not after. The server-rendering tests (#45) rewrite the
      # *built* `index.html` — that document is the shell, with Vite's hashed
      # asset names in it — so with no `dist/` the render finds no shell, returns
      # early, and 27 of them fail. Ordering it this way also means a broken
      # build is reported as a broken build rather than as a wall of failed
      # assertions.
      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      # After the build, because it weighs what the build produced. A ratchet
      # rather than a target: it fails on a weight *regression*, and the gap to
      # #39's 1.5s-on-3G criterion is recorded in the script rather than
      # enforced, because a check nobody can pass gets turned off.
      - name: Performance budget
        run: npm run budget

      - name: Test with coverage
        # Thresholds live in vitest.config.ts and are set at the measured floor,
        # so a coverage drop fails here rather than being noticed later.
        run: npm run test:coverage

      # Playwright's 187 browser specs are temporarily out of `verify`: the
      # `--with-deps` browser install fails on the current self-hosted runner
      # host. Re-add the Install Playwright browsers / Seed the local D1 /
      # End-to-end tests / Upload the Playwright report steps (see git history
      # on this file) once that host can install them.

      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const { execFileSync } = require('child_process')
            const marker = '<!-- nepscene-coverage -->'
            const table = execFileSync('node', ['scripts/coverage-summary.mjs'], { encoding: 'utf8' })
            if (!table.trim()) return
            const body = `${marker}\n${table}`
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find(c => c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body })
            }
